name: Build and Publish RFX9600 Bridge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read add-on version
        id: version
        run: echo "version=$(jq -r .version rfx9600_bridge/config.json)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./rfx9600_bridge
          file: ./rfx9600_bridge/Dockerfile
          push: true
          tags: ghcr.io/cathouse85/rfx9600_bridge:${{ steps.version.outputs.version }}
